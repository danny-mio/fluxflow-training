# FluxFlow Configuration Example
# Copy this file to config.yaml and customize for your needs

model:
  # Model architecture type: "bezier" (default) or "baseline" (for comparison)
  model_type: "bezier"  # Options: "bezier", "baseline"
  # Model version: automatically discovered versions (default: "0.7.0")
  model_version: "0.7.0"  # Available: dynamically discovered (0.7.0=context-enhanced, 0.6.0, 0.3.0, ...)

  # Core dimensions
  vae_dim: 128  # VAE latent dimension (32 for limited GPU, 128/256 for better quality)
  feature_maps_dim: 128  # Flow processor feature dimension
  feature_maps_dim_disc: 8  # Discriminator feature dimension
  text_embedding_dim: 1024
  pretrained_bert_model: null  # Path to pretrained BERT checkpoint (optional)

  # Baseline-specific parameters (only used when model_type: "baseline")
  baseline_activation: "silu"  # Options: "silu", "gelu", "relu"
  baseline_vae_width_mult: 4.5  # VAE width multiplier
  baseline_vae_depth_mult: 1.0  # VAE depth multiplier
  baseline_flow_blocks: 17  # Number of flow transformer blocks
  baseline_flow_ffn_expansion: 4.0  # Flow FFN expansion factor

data:
  # Local dataset (choose this OR webdataset)
  data_path: "/path/to/your/images"
  captions_file: "/path/to/your/captions.txt"  # Format: image_name<tab>caption

  # Optional fixed text to prepend to all prompts during training
  # Example: "style anime" will convert "a girl running" to "style anime. a girl running"
  # Use this to ensure specific styles/types are always included in fine-tuning
  fixed_prompt_prefix: null  # e.g., "style anime", "photo realistic", "digital art"

  # OR use WebDataset streaming (HuggingFace datasets)
  use_webdataset: false
  webdataset_token: null  # Your HuggingFace token
  webdataset_url: "hf://datasets/jackyhate/text-to-image-2M/data_512_2M/*.tar"  # Example: TTI-2M
  webdataset_image_key: "png"   # Key for image data in tar samples (e.g., "jpg", "png")
  webdataset_label_key: "json"  # Key for label/metadata in tar samples
  webdataset_caption_key: "prompt"  # Key for caption text within the JSON (e.g., "prompt", "caption")
  webdataset_size: 2000000      # Total samples (TTI-2M has ~2M). If null, estimates from shard count.
  webdataset_samples_per_shard: 10000  # Samples per shard for estimation

  # Legacy aliases (deprecated, use webdataset_* instead)
  # use_tt2m: false  # Use use_webdataset instead
  # tt2m_token: null  # Use webdataset_token instead

  # WebDataset error recovery settings
  dataloader_max_retries: 5      # Max retries per batch on errors
  dataloader_retry_delay: 5.0    # Base delay between retries (seconds)

  # Common settings
  img_size: 1024
  channels: 3
  tokenizer_name: "distilbert-base-uncased"

  # Max tokenized caption length (padding/truncation) for training. Default 32
  # matches the v0.10.0 flow processor's T_txt (fluxflow.text_length.DEFAULT_MAX_TEXT_LENGTH,
  # the single shared constant generation also reads -- see fluxflow-core/src/fluxflow/text_length.py).
  # Truncation beyond this length is SILENT by default: the dataset classes in
  # fluxflow_training/data/datasets.py sample captions and log a running
  # truncation-rate / true-length-distribution summary (min/max/mean/p50/p95)
  # via the standard logger -- watch for "caption truncation stats" log lines
  # during an epoch before deciding whether/how far to raise this value.
  # Raising it is a real behavior change requiring retraining (the model has
  # never seen text sequences longer than whatever this was during training),
  # not just a config tweak -- see docs/MULTI_DATASET_TRAINING.md.
  max_text_length: 32

  # Multi-scale training: train on reduced versions of images
  # For each size smaller than image's min dimension, creates a downscaled version
  # Example: [128, 256, 512] - a 1024px image trains at 128, 256, 512, and 1024
  reduced_min_sizes: null  # e.g., [128, 256, 512]

training:
  # Basic training settings (legacy mode)
  n_epochs: 100
  batch_size: 1
  workers: 8
  lr: 0.00001  # 1e-5
  lr_min: 0.01  # Minimum LR multiplier
  training_steps: 1
  use_fp16: false
  # precision: fp16  # "fp16" (default) or "bf16"; only consulted when use_fp16 is true.
  # bf16 shares fp32's exponent range (no overflow-to-Inf on large activations,
  # unlike fp16's ~65504 max) at the cost of mantissa precision -- a mitigation
  # for fp16 NaN/Inf training crashes.
  initial_clipping_norm: 1.0
  preserve_lr: true

  # Training modes (enable at least one) - LEGACY MODE ONLY
  train_vae: true
  gan_training: true
  use_lpips: true  # Enable LPIPS perceptual loss (improves visual quality, reduces blur)
  train_diff: false
  train_diff_full: false

  # KL divergence settings
  # NOTE: KL is now normalized by dimensions (resolution-invariant)
  # Old behavior: KL ~150K for 512x512, weighted by 0.0001 → effective weight 15.0
  # New behavior: KL ~1.2 for any resolution, weighted by 0.001 → effective weight 0.0012
  # If you need legacy behavior, set normalize_by_dims=False in vae_trainer.py
  kl_beta: 0.001  # Increased 10× to compensate for normalized KL
  kl_warmup_steps: 5000
  kl_free_bits: 0.0

  # v0.10.0: KL weight on the clean Gaussian z latent (design §5.5), an alternative
  # to the legacy kl_beta path above. Wired into both the legacy train.py script and
  # the pipeline orchestrator's VAETrainer(...) call. Default 0.0 (this key's default
  # in both --kl_z_weight and legacy-script YAML) means kl_beta/kl_warmup_steps stays
  # active. kl_z_weight > 0 takes priority over kl_beta (cosine warmup over
  # kl_z_warmup_steps instead of kl_warmup_steps). NOTE: in pipeline-mode configs,
  # PipelineStepConfig's own field default is 0.5 (design doc default) — omitting
  # this key from a pipeline step's YAML uses 0.5, not 0.0. Set it explicitly (as
  # here) to opt out and keep the legacy kl_beta path.
  kl_z_weight: 0.0

  # v0.10.0: L2-like shrinkage pressure on the ctx branch to keep it informative
  # without collapsing (design §5.5); warms up from ctx_shrinkage_warmup_start_step
  # over ctx_shrinkage_warmup_steps. Wired into both training drivers. Default 0.0
  # (this key's default in both --ctx_shrinkage_weight and legacy-script YAML) =
  # inactive. NOTE: in pipeline-mode configs, PipelineStepConfig's own field default
  # is 0.001 — omitting this key from a pipeline step's YAML uses 0.001, not 0.0. Set
  # it explicitly (as here) to opt out and keep it inactive.
  ctx_shrinkage_weight: 0.0

  # Discriminator update-frequency knob (opt-in efficiency tuning, additive only).
  # Runs discriminator forward+backward every N global steps. 1 (default) = every
  # step, exactly matching current behavior. Increase to reduce discriminator
  # compute at the cost of a staler adversarial signal.
  discriminator_update_freq: 1

  # VAE loss component settings
  train_kl: true
  train_colorstats: true
  train_histogram: true
  train_contrast: true
  train_coarseness: true

  # GAN settings
  lambda_adv: 0.5

  # LPIPS perceptual loss settings
  # Lower weight = sharper outputs (prioritizes pixel accuracy)
  # Higher weight = smoother outputs (prioritizes perceptual similarity)
  lambda_lpips: 0.1  # Recommended: 0.05-0.2 range

  # v0.10.0: auxiliary context reconstruction loss (plan §4.1 / DP-1).
  # MSE(context_tokens, stop_grad(z_tokens)); encourages context branch alignment.
  # Active only during VAE training steps. Default 0.01.
  lambda_ctx_aux: 0.01

  # v0.10.0: relative weight of context-dim v-prediction loss in FlowTrainer.
  # Context dims are now 50% of packed width (128/256 vs ~4% in v0.8.0).
  # Default 0.5 prevents context denoising from dominating VAE-dim denoising.
  ctx_loss_weight: 0.5

  # v0.10.0: freeze context branch independently from z-path encoder.
  # Useful for phased training: train z-path first, then unfreeze context branch.
  # Set true to freeze ctx_encoder_first_step, ctx_encoder_z, ctx_proj,
  # ctx_token_attn, ctx_final_norm inside the compressor. Default false.
  freeze_context_branch: false

  # ============================================================================
  # PIPELINE MODE (Optional - enables multi-step training)
  # ============================================================================
  # Uncomment this section to enable pipeline mode.
  # When 'pipeline' is present, legacy training modes above are ignored.

  # pipeline:
  #   mode: "sequential"  # Currently only 'sequential' is supported
  #
  #   steps:
  #     # Step 1: VAE training with SPADE OFF
  #     - name: "vae_spade_off"
  #       description: "Train VAE without SPADE conditioning (hypothesis: learn base reconstruction first)"
  #       duration_epochs: 50
  #       max_steps: null        # Optional: limit batches per epoch for quick testing (e.g., max_steps: 10)
  #
  #       # Training modes for this step
  #       train_vae: true
  #       train_flow: false
  #       gan_training: true
  #       use_lpips: true
  #
  #       # Freeze/unfreeze modules (optional)
  #       freeze_modules:
  #         flow_processor: true   # Freeze flow during VAE training
  #         compressor: false
  #         expander: false
  #         text_encoder: true     # Freeze text encoder during VAE
  #         discriminator: false
  #
  #       # Inline optimizer configs (no external JSON needed)
  #       optimizers:
  #         vae:
  #           optimizer_type: "AdamW"
  #           lr: 0.0001
  #           betas: [0.9, 0.999]
  #           weight_decay: 0.01
  #           eps: 1e-8
  #         discriminator:
  #           optimizer_type: "AdamW"
  #           lr: 0.0001
  #           betas: [0.9, 0.999]
  #           weight_decay: 0.01
  #
  #       # Inline scheduler configs
  #       schedulers:
  #         vae:
  #           scheduler_type: "CosineAnnealingLR"
  #           eta_min_factor: 0.01
  #         discriminator:
  #           scheduler_type: "CosineAnnealingLR"
  #           eta_min_factor: 0.01
  #
  #       # Transition criteria (optional - enables early exit)
  #       transition_criteria:
  #         min_epochs: 20          # Run at least 20 epochs
  #         max_epochs: 50          # Hard limit
  #         loss_threshold: 0.05    # Move to next step if loss < 0.05
  #         metric_name: "vae_loss" # Which metric to monitor
  #         patience: 5             # Wait 5 epochs before transitioning
  #
  #     # Step 2: VAE training with SPADE ON
  #     - name: "vae_spade_on"
  #       description: "Enable SPADE conditioning (hypothesis: refine with spatial conditioning)"
  #       duration_epochs: 50
  #
  #       train_vae: true
  #       train_flow: false
  #       gan_training: true
  #       use_lpips: true
  #
  #       freeze_modules:
  #         flow_processor: true
  #         compressor: false
  #         expander: false
  #         text_encoder: true
  #         discriminator: false
  #
  #       optimizers:
  #         vae:
  #           optimizer_type: "AdamW"
  #           lr: 0.00005  # Lower LR for refinement
  #           betas: [0.9, 0.999]
  #           weight_decay: 0.01
  #         discriminator:
  #           optimizer_type: "AdamW"
  #           lr: 0.00005
  #           betas: [0.9, 0.999]
  #           weight_decay: 0.01
  #
  #       schedulers:
  #         vae:
  #           scheduler_type: "CosineAnnealingLR"
  #           eta_min_factor: 0.01
  #         discriminator:
  #           scheduler_type: "CosineAnnealingLR"
  #           eta_min_factor: 0.01
  #
  #       transition_criteria:
  #         min_epochs: 20
  #         max_epochs: 50
  #         loss_threshold: 0.03
  #         metric_name: "vae_loss"
  #         patience: 5
  #
  #     # Step 3: Flow training with frozen VAE
  #     - name: "flow_frozen_vae"
  #       description: "Train flow processor with frozen VAE"
  #       duration_epochs: 100
  #
  #       train_vae: false
  #       train_flow: true
  #       gan_training: false
  #       use_lpips: false
  #
  #       freeze_modules:
  #         flow_processor: false
  #         compressor: true    # Freeze VAE
  #         expander: true      # Freeze VAE
  #         text_encoder: false # Train text encoder with flow
  #         discriminator: true
  #
  #       optimizers:
  #         flow:
  #           optimizer_type: "AdamW"
  #           lr: 0.00001
  #           betas: [0.9, 0.999]
  #           weight_decay: 0.01
  #         text_encoder:
  #           optimizer_type: "AdamW"
  #           lr: 0.000001  # Lower LR for text encoder
  #           betas: [0.9, 0.999]
  #           weight_decay: 0.01
  #
  #       schedulers:
  #         flow:
  #           scheduler_type: "CosineAnnealingLR"
  #           eta_min_factor: 0.01
  #         text_encoder:
  #           scheduler_type: "CosineAnnealingLR"
  #           eta_min_factor: 0.01
  #
  #       # --- Split text encoder optimizers (v0.10.0+) ---
  #       # Use text_encoder_backbone / text_encoder_projection instead of the whole
  #       # text_encoder key to apply independent LRs to the DistilBERT backbone and
  #       # the projection head. These keys are mutually exclusive with "text_encoder".
  #       #
  #       # Example — freeze backbone, fine-tune projection only:
  #       #   freeze:
  #       #     - text_encoder_backbone
  #       #   optimizers:
  #       #     flow:
  #       #       optimizer_type: "AdamW"
  #       #       lr: 0.00001
  #       #     text_encoder_projection:
  #       #       optimizer_type: "AdamW"
  #       #       lr: 0.0001
  #       #
  #       # Example — train both sub-components at different rates:
  #       #   optimizers:
  #       #     flow:
  #       #       optimizer_type: "AdamW"
  #       #       lr: 0.00001
  #       #     text_encoder_backbone:
  #       #       optimizer_type: "AdamW"
  #       #       lr: 0.000001   # Very low LR for pretrained DistilBERT
  #       #     text_encoder_projection:
  #       #       optimizer_type: "AdamW"
  #       #       lr: 0.00005    # Higher LR for projection head

optimization:
  # Path to JSON file with detailed optimizer/scheduler configs (optional).
  # Overrides the per-model defaults in optimizer_factory.get_default_optimizer_config
  # / scheduler_factory.get_default_scheduler_config (used by the legacy train.py
  # script's load_optimizer_scheduler_config). File shape:
  #
  #   {
  #     "optimizers": {
  #       "flow": {
  #         "type": "Lion",
  #         "lr": 1e-7,            # ~5-10x smaller than the equivalent AdamW lr —
  #                                # Lion's sign-based update is constant-magnitude
  #                                # per step, so a too-large lr oscillates instead
  #                                # of converging (Chen et al. 2023).
  #         "betas": [0.9, 0.95],
  #         "weight_decay": 0.05,  # ~5-10x larger than the equivalent AdamW value
  #         "decoupled_weight_decay": true
  #       },
  #       "vae": {"type": "AdamW", "lr": 5e-7, "weight_decay": 0.01}
  #     },
  #     "schedulers": {
  #       "flow": {"type": "CosineAnnealingLR", "eta_min_factor": 0.01}
  #     }
  #   }
  optim_sched_config: null

output:
  output_path: "outputs/flux"
  log_interval: 10
  checkpoint_save_interval: 50
  samples_per_checkpoint: 1
  no_samples: false
  test_image_address:
    - "template.png"
  sample_captions:
    - "illustration of a boy playing guitar in the forest in autumn"
    - "photo of a girl elf with blue Santa costume by a cottage in the snow"
    - "on a yellow background, a blue triangle on the bottom"
    - "an orange banana"
  # Sample image sizes: integers for square, or [width, height] for rectangular
  # Default: [256, 384, 512, 1024]
  sample_sizes:
    - 256
    - 384
    - 512
    - [768, 512]  # landscape
    - [512, 768]  # portrait
    - 1024
  log_level: "INFO"
  log_file: null  # Optional: "outputs/training.log"

# Model checkpoint to resume from (optional)
model_checkpoint: null  # "outputs/flux/flxflow_final.safetensors"
